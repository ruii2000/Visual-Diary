<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Visual Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one endless vertical strip on a gentle cylinder (WebGL). The centred print sits flat; its neighbours recede to a thin sliver at the top and bottom edges. Number + title in the left column, tick index on the right; compact screens dock the caption at the bottom. */
:root{
  --bg:#EEF0ED;
  --ink:#1C201E;
  --ink-2:#4B514D;
  --muted:#8A908C;
  --line:#CDD2CE;
  --accent:#2E4A3F;
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --bar-h:80px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}

.stage{position:fixed;inset:0;overflow:hidden;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.stage.dragging{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.1s ease;
  -webkit-mask-image:linear-gradient(to bottom,transparent var(--m0,0px),#000 var(--m1,8%),#000 var(--m2,92%),transparent var(--m3,100%));
          mask-image:linear-gradient(to bottom,transparent var(--m0,0px),#000 var(--m1,8%),#000 var(--m2,92%),transparent var(--m3,100%))}
.stage canvas.on{opacity:1}

.bar{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.mark{font-weight:500;font-size:15px;letter-spacing:-.005em;line-height:1.2}
.kicker{font-size:12px;line-height:1.5;color:var(--accent);max-width:46ch}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px;flex:none}
.count b{font-weight:400;color:var(--ink)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:4px}

.dock{position:fixed;z-index:4;left:max(32px,env(safe-area-inset-left,0px));top:var(--bar-h);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  width:clamp(180px,15vw,232px);display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.cap{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.no{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.t{margin:0;font-weight:500;font-size:clamp(24px,1.9vw,30px);line-height:1.2;letter-spacing:-.015em;color:var(--ink);text-wrap:balance;
  max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}

.rail{position:fixed;z-index:4;top:50%;right:max(26px,calc(env(safe-area-inset-right,0px) + 16px));transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:flex-end}
.rail button{appearance:none;background:none;border:0;padding:0 0 0 16px;height:var(--tick-h,16px);display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--muted)}
.rail .tk{display:block;width:12px;height:1px;background:currentColor;transition:width .6s var(--ease)}
.rail .lb{font-size:12px;white-space:nowrap;opacity:0;transform:translateX(6px);transition:opacity .3s,transform .3s var(--ease)}
.rail button:hover,.rail button[aria-current="true"]{color:var(--ink)}
.rail button:hover .lb,.rail button:focus-visible .lb{opacity:1;transform:none}
.rail button[aria-current="true"] .tk{width:34px}
.rail button:focus-visible{outline-offset:2px}

.hint{position:fixed;z-index:4;right:max(26px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  margin:0;writing-mode:vertical-rl;display:flex;align-items:center;gap:12px;
  font-size:11px;letter-spacing:.06em;color:var(--muted);transition:opacity .8s;pointer-events:none}
.hint::before{content:"";width:1px;height:28px;background:var(--line)}
.hint.gone{opacity:0}

@media (min-width:640px){
  .bar{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
}
@media (min-width:1000px) and (min-height:560px){ .count{display:none} }
@media (max-width:999px),(max-height:559px){
  .dock{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:auto;display:block}
  .cap{flex-direction:row;align-items:baseline;gap:12px}
  .t{display:block;font-size:18px;letter-spacing:-.01em;white-space:nowrap;text-overflow:ellipsis;min-width:0}
  .rail,.hint{display:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){ .stage canvas,.rail .tk,.rail .lb,.hint{transition:none} }
</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="gl" aria-hidden="true"></canvas></div>

<header class="bar" id="bar">
  <div class="brand">
    <span class="mark">A Visual Diary</span>
    <span class="kicker" id="kicker" role="status" hidden></span>
  </div>
  <span class="count" aria-hidden="true"><b id="cur">01</b> / <span id="tot">09</span></span>
</header>

<aside class="dock" id="dock" aria-hidden="true">
  <div class="cap" id="capIn">
    <span class="no" id="cNo">No. 01</span>
    <h2 class="t" id="cT"></h2>
  </div>
</aside>

<nav class="rail" id="rail" aria-label="Image index"></nav>
<p class="hint" id="hint">Scroll · Drag</p>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(()=>{
/* ═══════════════════ 配置 ═══════════════════
   图片放在 index.html 旁边的 images 文件夹里，从 0 开始编号：0.png、1.png、2.png……
   如果图片直接放在 index.html 同一层（没有 images 文件夹），也会自动找到。
   下面写"文件编号"的地方都指文件名里的数字：0.png 是页面上的 No. 01，4.png 是 No. 05。 */
const IMAGE_DIR   = 'images/';
const IMAGE_COUNT = 8;
const IMAGE_EXT   = '.png';
const TITLES = ['Bay at Night','Summit','Foothills','Golden I-85','Treehouse','Schoolyard','Dining Hall','Night Woods'];  // 依次对应 0.png、1.png……
const BEND  = 0.10;   // 弯曲程度：0 为平面
const DEPTH = 0.50;   // 空间纵深：越大，上下图片退得越远
const IMAGE_SIZE = 0.60;  // 居中图片大小：方图的边长约为屏幕高度的 60%，改大改小即整体缩放。
                          // 横图和竖图按面积相同缩放：竖图更高，横图更宽、更矮。
                          // 竖图最高约为屏幕高度的 70%，横图最宽不超过中间区域。
const SCALES = {};        // 单独放大或缩小某一张，键是文件编号，例如 {3: 1.15, 7: 0.9}
const WHITE_BG = [4, 5, 6, 7];  // 这几张居中时背景变成接近全白（文件编号，4–7 即页面上的 No. 05–08）；不需要就写 []
/* ═══════════════════════════════════════════ */

const $=s=>document.querySelector(s);
const stage=$('#stage'),bar=$('#bar'),dock=$('#dock'),rail=$('#rail'),hint=$('#hint'),kicker=$('#kicker'),
      curEl=$('#cur'),totEl=$('#tot'),live=$('#live'),capIn=$('#capIn'),cNo=$('#cNo'),cT=$('#cT'),root=document.documentElement;
let cv=$('#gl');
const N=Math.max(1,IMAGE_COUNT|0),BG=[238,240,237],PH=[224,228,225],FOG=.22+.5*DEPTH;
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const mqWide=matchMedia('(min-width:1000px) and (min-height:560px)');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t);
const mod=(a,n)=>((a%n)+n)%n;
const pad=n=>String(n).padStart(N>=100?3:2,'0');

const items=Array.from({length:N},(_,i)=>({i,title:String(TITLES[i]??'').trim()||'Untitled',
  w:4,h:5,dw:0,dh:0,img:null,state:'loading',path:'',avg:null,tex:null,texGen:-1,texAt:0}));

/* ---------- status line ---------- */
let statusKind='';
function setStatus(msg,kind=''){kicker.textContent=msg||'';kicker.hidden=!msg;statusKind=msg?kind:'';}

/* ---------- loading 0.png … 8.png ---------- */
function candidates(i){
  const f=i+IMAGE_EXT,dir=String(IMAGE_DIR||'').replace(/^\.\//,'');
  return dir?[dir+f,f]:[f];
}
const isCross=src=>{try{return new URL(src,location.href).origin!==location.origin;}catch(_){return false;}};
function averageColor(src){
  const c=document.createElement('canvas');c.width=c.height=24;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,24,24);
  const d=x.getImageData(0,0,24,24).data;let r=0,g=0,b=0,n=0;
  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
  return n?[r/n,g/n,b/n]:null;
}
function missingCard(it,path){
  const c=document.createElement('canvas');c.width=800;c.height=1000;const x=c.getContext('2d');
  x.fillStyle='rgb(228,231,228)';x.fillRect(0,0,800,1000);
  x.strokeStyle='rgba(28,32,30,.25)';x.setLineDash([10,10]);x.lineWidth=2;x.strokeRect(40,40,720,920);
  x.textAlign='center';x.textBaseline='middle';
  x.fillStyle='#4B514D';x.font='500 40px Inter,"Helvetica Neue",Arial,sans-serif';x.fillText('Image not found',400,470);
  x.fillStyle='#8A908C';x.font='28px Inter,"Helvetica Neue",Arial,sans-serif';x.fillText(path,400,530);
  it.img=c;it.w=800;it.h=1000;it.state='missing';it.path=path;
}
function load(it){
  const list=candidates(it.i);let k=0;
  return new Promise(done=>{
    const next=()=>{
      if(k>=list.length){missingCard(it,list[0]);done();return;}
      const src=list[k++],img=new Image();
      if(isCross(src))img.crossOrigin='anonymous';
      img.decoding='async';
      if(it.i<2||it.i===N-1)img.fetchPriority='high';
      img.onload=()=>{
        const fin=()=>{
          it.img=img;it.w=img.naturalWidth||4;it.h=img.naturalHeight||5;it.state='ok';it.path=src;
          try{it.avg=averageColor(img);}catch(_){it.avg=null;}
          done();
        };
        img.decode?img.decode().then(fin,fin):fin();
      };
      img.onerror=next;
      img.src=src;
    };
    next();
  });
}

/* ---------- geometry ---------- */
let W=0,H=0,dpr=1,focusY=0,T=0,K=0,PUSH=0,camF=1,camD=1,maxTex=2048,glMax=2048,g1=[],g2=[];
function bendYZ(vy,F){
  if(Math.abs(K)<1e-9)return[vy,0];
  const a=Math.abs(vy),th=Math.max(0,a-F)*K;
  return[Math.sign(vy)*(Math.min(a,F)+Math.sin(th)/K),(Math.cos(th)-1)/K];
}
/* screen distance from the focus line to a neighbour's near edge, when the centred print has half-height hc */
function edgeOffset(hc,hn,g){
  const[Y,Zb]=bendYZ(hc+g,hc+1),pz=PUSH*(hc+g+hn);
  return Y*camD/(camD-Zb+pz);
}
function solveGap(hc,hn){
  if(edgeOffset(hc,hn,0)>=T)return 12;
  let lo=0,hi=H*4;
  for(let n=0;n<40;n++){const m=(lo+hi)/2;if(edgeOffset(hc,hn,m)<T)lo=m;else hi=m;}
  return Math.max(12,(lo+hi)/2);
}
const probe=document.createElement('div');
probe.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)';
document.body.append(probe);

function layout(){
  W=stage.clientWidth;H=stage.clientHeight;if(!W||!H)return;
  dpr=Math.min(2,window.devicePixelRatio||1);
  const cw=Math.round(W*dpr),ch=Math.round(H*dpr);if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch;}
  maxTex=clamp(Math.ceil(Math.max(W,H)*dpr/256)*256,1024,Math.min(2048,glMax));
  const wide=mqWide.matches,topH=bar.offsetHeight,ib=parseFloat(getComputedStyle(probe).paddingBottom)||0;
  root.style.setProperty('--bar-h',topH+'px');
  let bandTop,bandBot,aw;
  if(wide){bandTop=0;bandBot=H;aw=W-2*Math.max(270,W*.2);}
  else{bandTop=topH;bandBot=H-(dock.offsetHeight+16+ib+10);aw=W-40;}
  const band=Math.max(200,bandBot-bandTop);bandBot=bandTop+band;
  focusY=bandTop+band/2;
  const sliver=wide?clamp(H*.07,36,84):clamp(band*.075,22,56);
  T=band/2-sliver;
  const mh=Math.max(80,2*(T-band*.075));
  K=BEND*2.2/H;PUSH=DEPTH*.7;
  const fov=(10+55*DEPTH)*Math.PI/180;camF=1/Math.tan(fov/2);camD=(H/2)*camF;
  cv.style.setProperty('--m0',bandTop+'px');cv.style.setProperty('--m1',(bandTop+sliver)+'px');
  cv.style.setProperty('--m2',(bandBot-sliver)+'px');cv.style.setProperty('--m3',bandBot+'px');
  /* equal-area sizing: a square print is S tall; portraits grow taller, landscapes wider, all capped by the column */
  const S=clamp(+IMAGE_SIZE||.6,.1,2)*band;
  items.forEach(it=>{
    const r=Math.sqrt(it.w/it.h),sc=clamp(+((SCALES||{})[it.i])||1,.2,3);
    const dw=S*r*sc,dh=S/r*sc,f=Math.min(1,aw/dw,mh/dh);
    it.dw=dw*f;it.dh=dh*f;
  });
  for(let a=0;a<N;a++){const A=items[a].dh/2,B=items[(a+1)%N].dh/2;g1[a]=solveGap(A,B);g2[a]=solveGap(B,A);}
  rail.style.setProperty('--tick-h',clamp(H*.44/N,5,18)+'px');
}
/* the strip flexes: each gap eases between "left print centred" and "right print centred", so every resting view shows the same thin sliver */
function gapAt(p,uu){const a=mod(p,N);if(uu<=p)return g1[a];if(uu>=p+1)return g2[a];return g1[a]+(g2[a]-g1[a])*smooth(uu-p);}
function pitch(p,uu){return items[mod(p,N)].dh/2+gapAt(p,uu)+items[mod(p+1,N)].dh/2;}
const segLen=uu=>pitch(Math.floor(uu),uu);
function positions(uu){
  const m=Math.floor(uu),t=uu-m,o=-t*pitch(m,uu),out=[{p:m,o}];
  let ob=o,oa=o;
  for(let j=1;j<=3;j++){ob+=pitch(m+j-1,uu);out.push({p:m+j,o:ob});oa-=pitch(m-j,uu);out.push({p:m-j,o:oa});}
  return out;
}

/* ---------- WebGL ---------- */
const VS=`attribute vec2 aPos;
uniform mat4 uP;uniform vec2 uSize;uniform float uY,uK,uD,uPush,uShift,uF;
varying vec2 vUv;varying float vShade,vZ;
void main(){
  vec2 p=aPos*uSize;float vy=uY+p.y;float Y=vy,Z=0.,sh=1.;
  if(abs(uK)>1e-7){float e=max(abs(vy)-uF,0.);float th=e*uK;Y=sign(vy)*(min(abs(vy),uF)+sin(th)/uK);Z=(cos(th)-1.)/uK;sh=max(cos(th),0.);}
  Z-=uPush;
  vec4 c=uP*vec4(p.x,Y,Z-uD,1.);c.y+=uShift*c.w;gl_Position=c;
  vUv=vec2(aPos.x+.5,.5-aPos.y);vShade=sh;vZ=Z;
}`;
const FS=`precision mediump float;
uniform sampler2D uTex;uniform float uHasTex,uAlpha,uFog,uH;uniform vec3 uColor,uBg;
varying vec2 vUv;varying float vShade,vZ;
void main(){
  vec3 c=uHasTex>.5?texture2D(uTex,vUv).rgb:uColor;
  c*=mix(1.,vShade,.3);
  float f=clamp(-vZ/(uH*1.2),0.,1.)*uFog;
  c=mix(c,uBg,f);
  gl_FragColor=vec4(c*uAlpha,uAlpha);
}`;
let gl=null,isGL2=false,U={},nIdx=0,glGen=0,aniso=null,maxPOT=2048,ctx2d=null,lost=false;
function setupGL(){
  const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};
  const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  ['uP','uSize','uY','uK','uD','uPush','uShift','uF','uTex','uHasTex','uAlpha','uFog','uH','uColor','uBg'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  const R=64,v=[],idx=[];
  for(let r=0;r<=R;r++){const y=.5-r/R;v.push(-.5,y,.5,y);}
  for(let r=0;r<R;r++){const a=r*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);nIdx=idx.length;
  const loc=gl.getAttribLocation(prog,'aPos');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.disable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
  gl.uniform1i(U.uTex,0);
  aniso=gl.getExtension('EXT_texture_filter_anisotropic')||gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
  glMax=gl.getParameter(gl.MAX_TEXTURE_SIZE)||2048;maxPOT=1;while(maxPOT*2<=Math.min(glMax,2048))maxPOT*=2;
  glGen++;
}
function initGL(){
  const opt={alpha:true,premultipliedAlpha:true,antialias:true};
  gl=cv.getContext('webgl2',opt)||cv.getContext('webgl',opt)||cv.getContext('experimental-webgl',opt);
  if(!gl)return false;
  isGL2=typeof WebGL2RenderingContext!=='undefined'&&gl instanceof WebGL2RenderingContext;
  setupGL();return true;
}
function use2D(local){
  if(ctx2d)return;
  const c=cv.cloneNode(false);cv.replaceWith(c);cv=c;gl=null;ctx2d=cv.getContext('2d');
  items.forEach(it=>{it.tex=null;});
  layout();
  if(local)setStatus('本地直接打开时，浏览器不允许用图片做 3D 渲染，已改为平面显示。上传到 GitHub Pages 后即可看到完整效果。','local');
  kick();
}
function texFor(it,now){
  if(!it.img)return null;
  if(it.tex&&it.texGen===glGen)return it.tex;
  const src=it.img,w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;
  const sc=Math.min(1,maxTex/Math.max(w,h));let tw=Math.max(1,Math.round(w*sc)),th=Math.max(1,Math.round(h*sc));
  if(!isGL2){const p=n=>Math.min(maxPOT,Math.pow(2,Math.round(Math.log2(n))));tw=p(tw);th=p(th);}
  let up=src;
  if(tw!==w||th!==h){const c=document.createElement('canvas');c.width=tw;c.height=th;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,tw,th);up=c;}
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,up);}
  catch(e){gl.deleteTexture(t);use2D(true);return null;}
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(aniso)gl.texParameterf(gl.TEXTURE_2D,aniso.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  it.tex=t;it.texGen=glGen;it.texAt=(revealed&&now-revealAt>120)?now:-1e9;
  return t;
}

/* ---------- render ---------- */
let u=0,uT=0,raf=0,last=0,drag=null,cur=-1,announced=-1,revealed=false,revealAt=0,navigated=false,instances=[],flatF=0,fading=false;
let tintCur=BG.slice(),tintTgt=BG.slice(),lastBg='';
function frameDraw(now){
  if(!W||!H)return;
  const m=Math.floor(u),t=u-m,A=items[mod(m,N)],B=items[mod(m+1,N)];
  const F=flatF=A.dh/2+(B.dh/2-A.dh/2)*t+1;
  instances=[];
  for(const q of positions(u)){
    const it=items[mod(q.p,N)];if(Math.abs(q.o)-it.dh/2>H*1.6)continue;
    const pz=PUSH*Math.abs(q.o),cz=bendYZ(-q.o,F)[1]-pz;
    instances.push({it,p:q.p,o:q.o,pz,cz});
  }
  instances.sort((a,b)=>a.cz-b.cz);
  fading=false;
  const shift=(H/2-focusY)/(H/2);
  if(gl&&!lost){
    const aspect=W/H,near=camD*.04,far=camD+H*10;
    gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniformMatrix4fv(U.uP,false,new Float32Array([camF/aspect,0,0,0,0,camF,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]));
    gl.uniform1f(U.uK,K);gl.uniform1f(U.uF,F);gl.uniform1f(U.uD,camD);gl.uniform1f(U.uShift,shift);gl.uniform1f(U.uH,H);
    gl.uniform1f(U.uFog,FOG);gl.uniform3f(U.uBg,tintCur[0]/255,tintCur[1]/255,tintCur[2]/255);
    for(const n of instances){
      const it=n.it,tex=texFor(it,now);
      if(!gl){frameDraw(now);return;}
      gl.uniform2f(U.uSize,it.dw,it.dh);gl.uniform1f(U.uY,-n.o);gl.uniform1f(U.uPush,n.pz);
      const fa=tex?clamp((now-it.texAt)/650,0,1):0;
      if(fa<1){
        gl.uniform1f(U.uHasTex,0);gl.uniform3f(U.uColor,PH[0]/255,PH[1]/255,PH[2]/255);gl.uniform1f(U.uAlpha,1);
        gl.drawElements(gl.TRIANGLES,nIdx,gl.UNSIGNED_SHORT,0);
        if(tex)fading=true;
      }
      if(tex&&fa>0){
        gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
        gl.uniform1f(U.uHasTex,1);gl.uniform1f(U.uAlpha,fa);
        gl.drawElements(gl.TRIANGLES,nIdx,gl.UNSIGNED_SHORT,0);
      }
    }
  }else if(ctx2d){
    ctx2d.setTransform(dpr,0,0,dpr,0,0);ctx2d.clearRect(0,0,W,H);ctx2d.imageSmoothingQuality='high';
    const tc=`rgb(${tintCur.map(Math.round).join(',')})`;
    for(const n of instances){
      const r=project(n);
      if(n.it.img)ctx2d.drawImage(n.it.img,r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);
      else{ctx2d.fillStyle=`rgb(${PH.join(',')})`;ctx2d.fillRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);}
      const f=clamp(-n.cz/(H*1.2),0,1)*FOG;
      if(f>0){ctx2d.globalAlpha=f;ctx2d.fillStyle=tc;ctx2d.fillRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);ctx2d.globalAlpha=1;}
    }
  }
}
function project(n){
  const it=n.it,[Yt,Zt]=bendYZ(-n.o+it.dh/2,flatF),[Yb,Zb]=bendYZ(-n.o-it.dh/2,flatF);
  const st=camD/(camD-Zt+n.pz),sb=camD/(camD-Zb+n.pz),w=it.dw*Math.max(st,sb);
  return{x0:W/2-w/2,x1:W/2+w/2,y0:focusY-Yt*st,y1:focusY-Yb*sb};
}
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(tick);}}
function tick(now){
  raf=0;const dt=clamp(now-last,1,64);last=now;
  const dragging=drag&&drag.on;
  const base=reduce.matches?.45:(dragging?.35:.085),a=1-Math.pow(1-base,dt/16.67);
  u+=(uT-u)*a;if(Math.abs(uT-u)<4e-4&&!dragging)u=uT;
  const ta=1-Math.pow(1-.07,dt/16.67);let tb=false;
  for(let j=0;j<3;j++){const d=tintTgt[j]-tintCur[j];if(Math.abs(d)>.25){tintCur[j]+=d*ta;tb=true;}else tintCur[j]=tintTgt[j];}
  paintBg();updateCurrent();frameDraw(now);
  if(u===uT&&!dragging&&announced!==cur){announced=cur;live.textContent=`${cur+1} / ${N} · ${items[cur].title}`;}
  if(dragging||u!==uT||tb||fading)raf=requestAnimationFrame(tick);
}
function paintBg(){const c=`rgb(${tintCur.map(Math.round).join(',')})`;if(c!==lastBg){stage.style.backgroundColor=c;lastBg=c;}}
const WHITE=[252,252,251],whiteSet=new Set((Array.isArray(WHITE_BG)?WHITE_BG:[]).map(Number));
const tintOf=it=>whiteSet.has(it.i)?WHITE.slice():it.avg?BG.map((b,i)=>b*.9+it.avg[i]*.1):BG.slice();

/* ---------- caption / index ---------- */
function setCaption(i,anim){
  cNo.textContent='No. '+pad(i+1);cT.textContent=items[i].title;cT.title=items[i].title;
  if(anim&&!reduce.matches&&capIn.animate)capIn.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:520,easing:'cubic-bezier(.2,.7,.2,1)'});
}
function updateCurrent(){
  const i=mod(Math.round(u),N);if(i===cur)return;
  const first=cur<0;cur=i;setCaption(i,!first);curEl.textContent=pad(i+1);
  [...rail.children].forEach((b,k)=>b.setAttribute('aria-current',k===i?'true':'false'));
  tintTgt=tintOf(items[i]);if(first){tintCur=tintTgt.slice();paintBg();}
}
function buildRail(){
  rail.textContent='';
  items.forEach((it,i)=>{
    const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`Image ${i+1}: ${it.title}`);
    const lb=document.createElement('span');lb.className='lb';lb.textContent=`${pad(i+1)} ${it.title}`;
    const tk=document.createElement('span');tk.className='tk';
    b.append(lb,tk);b.addEventListener('click',()=>goTo(i));rail.append(b);
  });
  totEl.textContent=pad(N);
}
function nav(){if(!navigated){navigated=true;hint.classList.add('gone');}}
const snapDir=(v,dir,th)=>dir>0?Math.ceil(v-th):dir<0?Math.floor(v+th):Math.round(v);
function go(dir){uT=Math.round(uT)+dir;nav();kick();}
function goTo(j){const r=Math.round(uT);let d=mod(j-mod(r,N),N);if(d>N/2)d-=N;uT=r+d;nav();kick();}

/* ---------- input: wheel ---------- */
let snapT=0,wheelDir=0;
addEventListener('wheel',e=>{
  e.preventDefault();
  let dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?H:1);
  if(Math.abs(e.deltaX)>Math.abs(dy)*1.2||!dy)return;
  dy=clamp(dy,-H*.6,H*.6);wheelDir=Math.sign(dy);
  uT+=dy/segLen(uT);nav();
  clearTimeout(snapT);snapT=setTimeout(()=>{uT=snapDir(uT,wheelDir,.06);kick();},140);
  kick();
},{passive:false});

/* ---------- input: keys ---------- */
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA')return;
  switch(e.key){
    case'ArrowDown':case'PageDown':case'j':case'J':e.preventDefault();go(1);break;
    case'ArrowUp':case'PageUp':case'k':case'K':e.preventDefault();go(-1);break;
    case' ':if(tag==='BUTTON')return;e.preventDefault();go(e.shiftKey?-1:1);break;
    case'Home':e.preventDefault();goTo(0);break;
    case'End':e.preventDefault();goTo(N-1);break;
  }
});

/* ---------- input: drag / swipe / click ---------- */
stage.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  clearTimeout(snapT);
  drag={id:e.pointerId,y0:e.clientY,ly:e.clientY,u0:u,on:false,pts:[{y:e.clientY,t:performance.now()}]};
});
stage.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const now=performance.now();
  if(!drag.on){
    if(Math.abs(e.clientY-drag.y0)<5)return;
    drag.on=true;drag.ly=e.clientY;drag.u0=u;uT=u;stage.classList.add('dragging');nav();
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
  }
  uT-=(e.clientY-drag.ly)/segLen(uT);drag.ly=e.clientY;
  drag.pts.push({y:e.clientY,t:now});while(drag.pts.length>2&&now-drag.pts[0].t>110)drag.pts.shift();
  kick();
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(!d.on){if(e.type==='pointerup')hitTest(e.clientX,e.clientY);return;}
  stage.classList.remove('dragging');
  const p=d.pts,a=p[0],b=p[p.length-1],now=performance.now();
  const v=(b.t-a.t>0&&now-b.t<80)?(b.y-a.y)/(b.t-a.t):0;
  uT+=clamp(-v*320,-H*2.5,H*2.5)/segLen(uT);
  const moved=uT-d.u0,dir=Math.abs(v)>.3?-Math.sign(v):Math.sign(moved);
  uT=Math.abs(moved)<.02?Math.round(uT):snapDir(uT,dir,.12);
  kick();
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
function hitTest(x,y){
  let best=null;
  for(const n of instances){const r=project(n);if(x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1&&(!best||n.cz>best.cz))best=n;}
  if(best&&best.p!==Math.round(u)){uT=best.p;nav();kick();}
}

/* ---------- boot ---------- */
let glOK=false;
try{glOK=initGL();}catch(err){gl=null;glOK=false;const c=cv.cloneNode(false);cv.replaceWith(c);cv=c;}
if(glOK){
  cv.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;});
  cv.addEventListener('webglcontextrestored',()=>{try{setupGL();lost=false;kick();}catch(_){}});
}else ctx2d=cv.getContext('2d');

buildRail();layout();updateCurrent();frameDraw(performance.now());

function reveal(){
  if(revealed)return;revealed=true;revealAt=performance.now();
  layout();cv.classList.add('on');if(statusKind==='loading')setStatus(null);kick();
}
const settled=items.map(it=>load(it).then(()=>{
  layout();
  if(items[cur]===it)tintTgt=tintOf(it);
  kick();
}));
Promise.all([...new Set([0,1%N,N-1])].map(i=>settled[i])).then(reveal);
setTimeout(reveal,3000);
setTimeout(()=>{if(!revealed)setStatus('Loading…','loading');},500);
Promise.all(settled).then(()=>{
  const miss=items.filter(it=>it.state==='missing');
  if(miss.length&&statusKind!=='local'){
    const where=String(IMAGE_DIR||'').replace(/^\.\//,'');
    setStatus(`有 ${miss.length} 张图片没找到：${miss.map(it=>it.i+IMAGE_EXT).join('、')}。请放进 ${where||'网页所在'} 文件夹，并检查文件名大小写。`,'missing');
  }
});

new ResizeObserver(()=>{layout();kick();}).observe(stage);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{layout();kick();});
})();
</script>
</body>
</html>
